name: CI

# Lint, unit tests and a production build on every push and pull request,
# independent of where the site is hosted.
on:
  push:
    branches: [main, redcap, in-person]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
